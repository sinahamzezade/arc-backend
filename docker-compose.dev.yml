services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '9000:9000'
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: arc
      DB_PASSWORD: arc
      DB_NAME: arc
      DB_SYNC: 'true'
      NODE_ENV: development
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      JWT_REFRESH_TTL: 30d
      CORS_ORIGIN: http://localhost:3000
      ADMIN_SESSION_SECRET: dev-admin-session-secret-change-me
      ADMIN_SEED: 'true'
      ADMIN_SEED_EMAIL: ops.ctrl.9f2a@arc.internal
      ADMIN_SEED_PASSWORD: 'K7#mQ9$$vL2!pR4xW8nT'
      EMAIL_FROM: "${EMAIL_FROM:-Arc <onboarding@resend.dev>}"
      EMAIL_PROVIDER_API_KEY: "${EMAIL_PROVIDER_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ROADMAP_GENERATOR_PROMPT_VERSION: "${ROADMAP_GENERATOR_PROMPT_VERSION:-roadmap_generator_v1}"
      OPENAI_ROADMAP_MODEL: "${OPENAI_ROADMAP_MODEL:-gpt-4o-mini}"
      QUESTIONNAIRE_AI_ENABLED: "${QUESTIONNAIRE_AI_ENABLED:-true}"
      QUESTIONNAIRE_AI_PROMPT_VERSION: "${QUESTIONNAIRE_AI_PROMPT_VERSION:-questionnaire_copy_v1}"
      OPENAI_QUESTIONNAIRE_MODEL: "${OPENAI_QUESTIONNAIRE_MODEL:-gpt-4o-mini}"
      QUESTIONNAIRE_RESET_ON_BOOT: "${QUESTIONNAIRE_RESET_ON_BOOT:-false}"
      SKILL_GRAPH_RESET_ON_BOOT: "${SKILL_GRAPH_RESET_ON_BOOT:-false}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.groq.com/openai/v1}"
      LLM_INTAKE_MODEL: "${LLM_INTAKE_MODEL:-llama-3.3-70b-versatile}"
      LLM_INTAKE_FALLBACK_MODELS: "${LLM_INTAKE_FALLBACK_MODELS:-}"
      LLM_ROADMAP_MODEL: "${LLM_ROADMAP_MODEL:-llama-3.3-70b-versatile}"
      LLM_HTTP_REFERER: "${LLM_HTTP_REFERER:-http://localhost:3000}"
      LLM_APP_TITLE: "${LLM_APP_TITLE:-Arc}"
      INTAKE_DEFAULT_MODE: "${INTAKE_DEFAULT_MODE:-form}"
      INTAKE_CHAT_ENABLED: "${INTAKE_CHAT_ENABLED:-true}"
      REDIS_URL: redis://redis:6379
      ROADMAP_ENGINE_URL: http://roadmap-engine:8080
      ROADMAP_ENGINE_VERSION: '2'
      # Force LLM planner (python engine kept for fallback mode only)
      ROADMAP_ENGINE_MODE: llm
      ROADMAP_GENERATION_TIMEOUT_MS: "${ROADMAP_GENERATION_TIMEOUT_MS:-45000}"
      ROADMAP_GENERATION_MAX_RETRIES: '3'
      ROADMAP_SAFETY_FACTOR: '0.85'
      ROADMAP_WEEKLY_SLACK: '0.10'
    volumes:
      - .:/app # mount your source code
      - /app/node_modules # keep container's node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      roadmap-engine:
        condition: service_started

  roadmap-engine:
    build:
      context: ../roadmap-engine
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      ROADMAP_ENGINE_VERSION: '2'
      ROADMAP_SAFETY_FACTOR: '0.85'
      ROADMAP_WEEKLY_SLACK: '0.10'

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: arc
      POSTGRES_DB: arc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arc']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
