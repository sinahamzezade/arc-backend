services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '9000:9000'
    # JWT / admin secrets come from .env (single source of truth).
    # Hardcoding JWT here previously caused WS "invalid signature" + REST 401
    # when host .env used a different secret than the compose defaults.
    env_file:
      - .env
    environment:
      # Docker-network overrides only
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: arc
      DB_PASSWORD: arc
      DB_NAME: arc
      DB_SYNC: 'true'
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      ROADMAP_ENGINE_URL: http://roadmap-engine:8080
      ROADMAP_ENGINE_VERSION: '2'
      ROADMAP_ENGINE_MODE: llm
      ROADMAP_GENERATION_MAX_RETRIES: '3'
      ROADMAP_SAFETY_FACTOR: '0.85'
      ROADMAP_WEEKLY_SLACK: '0.10'
      # LAN + localhost (phones / second device on Wi-Fi)
      CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3000,http://192.168.254.23:3000
      # Pass through from project .env (compose interpolation) — must match Nest JWT issuer
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-dev-admin-session-secret-change-me}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-ops.ctrl.9f2a@arc.internal}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-K7#mQ9$$vL2!pR4xW8nT}
      ADMIN_SEED: 'true'
      EMAIL_FROM: "${EMAIL_FROM:-Arc <onboarding@resend.dev>}"
      EMAIL_PROVIDER_API_KEY: "${EMAIL_PROVIDER_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ROADMAP_GENERATOR_PROMPT_VERSION: "${ROADMAP_GENERATOR_PROMPT_VERSION:-roadmap_generator_v1}"
      OPENAI_ROADMAP_MODEL: "${OPENAI_ROADMAP_MODEL:-gpt-4o-mini}"
      QUESTIONNAIRE_AI_ENABLED: "${QUESTIONNAIRE_AI_ENABLED:-true}"
      QUESTIONNAIRE_AI_PROMPT_VERSION: "${QUESTIONNAIRE_AI_PROMPT_VERSION:-questionnaire_copy_v1}"
      OPENAI_QUESTIONNAIRE_MODEL: "${OPENAI_QUESTIONNAIRE_MODEL:-gpt-4o-mini}"
      QUESTIONNAIRE_RESET_ON_BOOT: "${QUESTIONNAIRE_RESET_ON_BOOT:-false}"
      SKILL_GRAPH_RESET_ON_BOOT: "${SKILL_GRAPH_RESET_ON_BOOT:-false}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      CEREBRAS_API_KEY: "${CEREBRAS_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      LLM_PROVIDER: "${LLM_PROVIDER:-cerebras}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_INTAKE_MODEL: "${LLM_INTAKE_MODEL:-gemma-4-31b}"
      LLM_INTAKE_FALLBACK_MODELS: "${LLM_INTAKE_FALLBACK_MODELS:-}"
      LLM_ROADMAP_MODEL: "${LLM_ROADMAP_MODEL:-gemma-4-31b}"
      LLM_ARLO_MODEL: "${LLM_ARLO_MODEL:-gemma-4-31b}"
      LLM_BATTLE_MODEL: "${LLM_BATTLE_MODEL:-gemma-4-31b}"
      LLM_LESSON_BODY_MODEL: "${LLM_LESSON_BODY_MODEL:-gemma-4-31b}"
      LLM_HTTP_REFERER: "${LLM_HTTP_REFERER:-http://localhost:3000}"
      LLM_APP_TITLE: "${LLM_APP_TITLE:-Arc}"
      INTAKE_DEFAULT_MODE: "${INTAKE_DEFAULT_MODE:-form}"
      INTAKE_CHAT_ENABLED: "${INTAKE_CHAT_ENABLED:-true}"
      ROADMAP_GENERATION_TIMEOUT_MS: "${ROADMAP_GENERATION_TIMEOUT_MS:-45000}"
    volumes:
      - .:/app # mount your source code
      - /app/node_modules # keep container's node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      roadmap-engine:
        condition: service_started

  roadmap-engine:
    build:
      context: ../roadmap-engine
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      ROADMAP_ENGINE_VERSION: '2'
      ROADMAP_SAFETY_FACTOR: '0.85'
      ROADMAP_WEEKLY_SLACK: '0.10'

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: arc
      POSTGRES_DB: arc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arc']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
