# Dev coturn — time-limited credentials via shared secret (HMAC).
# Backend issues username="{expiry}:{userId}" + credential = base64(hmac-sha1(secret, username)).

listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=dev-turn-shared-secret-change-me
realm=arc.local
# Prefer relay when needed; allow peer-reflexive via STUN on same port.
no-multicast-peers
no-cli
# Dev: open relay range (narrow in prod)
min-port=49160
max-port=49200
# Log to stdout
log-file=stdout
verbose
