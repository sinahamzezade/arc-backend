# Production coturn — HMAC time-limited credentials (match Nest TURN_SHARED_SECRET).
# Backend: username="{unixExpiry}:{userId}" credential=base64(hmac-sha1(secret, username))
#
# Deploy on a VPS with a public IP (NOT Railway HTTP). Open firewall:
#   3478/udp 3478/tcp  5349/tcp  49160-49200/udp
#
# Replace:
#   YOUR.PUBLIC.IP.OR.DNS
#   CHANGE_ME_STRONG_SECRET  (same value as Railway TURN_SHARED_SECRET)

listening-ip=0.0.0.0
relay-ip=YOUR.PUBLIC.IP.OR.DNS
external-ip=YOUR.PUBLIC.IP.OR.DNS

listening-port=3478
tls-listening-port=5349

fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=CHANGE_ME_STRONG_SECRET
realm=arc.app

# Optional TLS (turns:) — put certs on the host and uncomment:
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

min-port=49160
max-port=49200

# Per-session soft caps (abuse / cost control)
user-quota=12
total-quota=1200
max-bps=2000000

log-file=stdout
simple-log
